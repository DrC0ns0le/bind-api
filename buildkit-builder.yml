kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  containers:
  - name: buildkit
    # Use standard BuildKit image
    image: moby/buildkit:latest
    imagePullPolicy: Always

    # Keep container alive for Jenkins to execute commands
    command:
      - sleep
    args:
      - "9999999"

    # Security context for BuildKit in Kubernetes
    securityContext:
      # Run as root (required for BuildKit daemon)
      runAsUser: 0
      # Privileged mode (required for BuildKit to manage containers)
      privileged: true

    # Volume mounts for Docker config (registry auth)
    volumeMounts:
      - name: docker-config
        mountPath: /root/.docker
        readOnly: false

  volumes:
    # Docker registry credentials (initially empty, future: Jenkins secret)
    - name: docker-config
      emptyDir: {}
      # When registry requires auth, change to:
      # secret:
      #   secretName: docker-registry-creds
      #   items:
      #     - key: .dockerconfigjson
      #       path: config.json
